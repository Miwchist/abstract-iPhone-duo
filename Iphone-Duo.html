<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhone Duo — интерактивная 3D-модель</title>
<style>
:root{--f1:#c3beb6;--f2:#8d887f;--f3:#efebe4;--bk:#cfc9bf;--bk2:#b9b2a7;--wall:linear-gradient(#000,#000)}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;perspective:2400px;perspective-origin:50% 42%;background:radial-gradient(ellipse 80% 70% at 50% 38%,#2b2b30 0%,#151518 55%,#08080a 100%);cursor:grab;touch-action:none;overflow:hidden}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:50%;top:44%;transform-style:preserve-3d}
#phone,.half{position:absolute;left:0;top:0;transform-style:preserve-3d;transform-origin:0 0}
#shadow{position:absolute;left:50%;height:40px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),rgba(0,0,0,0));transform:translateX(-50%);pointer-events:none;filter:blur(6px);transition:width .1s}
.f{position:absolute;left:0;top:0;transform-origin:0 0;box-sizing:border-box}
.metal,.spine{backface-visibility:visible;background:linear-gradient(rgba(255,255,255,var(--h,0)),rgba(255,255,255,var(--h,0))),linear-gradient(rgba(0,0,0,var(--d,0)),rgba(0,0,0,var(--d,0))),var(--mg)}
.mv{--mg:linear-gradient(180deg,var(--f2),var(--f1) 22%,var(--f3) 50%,var(--f1) 78%,var(--f2))}
.mh{--mg:linear-gradient(90deg,var(--f2),var(--f1) 22%,var(--f3) 50%,var(--f1) 78%,var(--f2))}
.spine{--mg:linear-gradient(var(--f1),var(--f1))}
.cap{border-radius:50%;background:conic-gradient(from calc(var(--a) * -1deg),var(--f1) 0 calc(var(--a) * 1deg),transparent 0);filter:brightness(var(--b,1))}
.front,.coverback{background:#050506;backface-visibility:hidden;overflow:hidden}
.camback{background:linear-gradient(rgba(255,255,255,var(--h,0)),rgba(255,255,255,var(--h,0))),linear-gradient(rgba(0,0,0,var(--d,0)),rgba(0,0,0,var(--d,0))),linear-gradient(160deg,var(--bk),var(--bk2));backface-visibility:hidden;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.plateau{backface-visibility:hidden;background:linear-gradient(rgba(255,255,255,var(--h,0)),rgba(255,255,255,var(--h,0))),linear-gradient(rgba(0,0,0,var(--d,0)),rgba(0,0,0,var(--d,0))),linear-gradient(150deg,var(--f3),var(--bk) 40%,var(--bk2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),inset 0 -2px 4px rgba(0,0,0,.18)}
.plateau .flash{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff6d8 0 30%,#d8cfa8 55%,#9b947c 100%);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.plateau .lidar{position:absolute;border-radius:50%;background:radial-gradient(circle,#2a2a30 0 40%,#111 70%);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.plateau .mic{position:absolute;border-radius:50%;background:#2a2a2a}
.lens{backface-visibility:hidden;border-radius:50%;background:radial-gradient(circle,#05050a 0 26%,#1a2342 31%,#060608 38%,#121214 50%,#2f2f33 56%,#68686d 60%,#232326 66%,#3a3a3e 72%,var(--f2) 80%,var(--f3) 88%,var(--f2) 100%);box-shadow:0 2px 4px rgba(0,0,0,.45)}
.lens::after{content:"";position:absolute;inset:27%;border-radius:50%;background:radial-gradient(circle at 36% 30%,rgba(150,180,255,.7),transparent 22%),radial-gradient(circle at 64% 70%,rgba(255,110,200,.35),transparent 28%)}
.apple{position:absolute;color:var(--f3);opacity:.85;filter:drop-shadow(0 0 1px rgba(0,0,0,.15))}
.port{position:absolute;background:#1a1a1a;border-radius:99px;box-shadow:inset 0 1px 1px rgba(0,0,0,.8)}
.spk{position:absolute;display:flex;gap:2px}.spk i{width:2px;height:2px;border-radius:50%;background:#222}
.btn{border-radius:3px;cursor:pointer}
.fx{position:absolute;inset:0;pointer-events:none;z-index:20;border-radius:inherit}
.fx .sh{position:absolute;inset:0;background:#000;opacity:var(--d,0)}
.fx .gl{position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.13) 46%,rgba(255,255,255,.03) 54%,transparent 62%);background-size:320% 320%;background-position:calc(50% + var(--gx,0) * 1%) calc(50% + var(--gy,0) * 1%)}
.fx .cr{position:absolute;top:0;bottom:0;width:7%;opacity:var(--cr,0)}
.front.l .cr{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.55))}
.front.r .cr{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.55))}

/* ---------- UI ---------- */
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
.brand{position:absolute;left:24px;top:20px}
.brand b{display:block;font-size:20px;font-weight:650;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:rgba(255,255,255,.55)}
.hint{position:absolute;right:24px;top:24px;font-size:12px;color:rgba(255,255,255,.45);text-align:right;line-height:1.6}
.bar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:10px 14px;border-radius:18px;background:rgba(40,40,44,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);pointer-events:auto;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 30px);box-sizing:border-box}
.bar button{font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.1);border:0;border-radius:10px;padding:7px 12px;cursor:pointer}
.bar button:hover{background:rgba(255,255,255,.18)}
.bar #foldBtn{background:#2783de;font-weight:600;min-width:92px}
.bar #foldBtn:hover{background:#3b93ea}
.sl{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.65)}
.sl b{color:#fff;font-weight:600;min-width:34px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:rgba(255,255,255,.22);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff;cursor:pointer}
#ang{width:130px}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:2px}
.seg button{background:none;padding:6px 10px;border-radius:8px}
.seg button.on{background:rgba(255,255,255,.2)}
.sws{display:flex;gap:7px}
.sws i{width:18px;height:18px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);outline-offset:2px}
.sws i.on{outline:2px solid #fff}
/* ---------- Screens ---------- */
.screen{position:absolute;overflow:hidden;background:#000;color:#fff;line-height:1.25;cursor:default;isolation:isolate;z-index:1}
.screen *{box-sizing:border-box}
.screen button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.screen input,.screen textarea{font:inherit;color:inherit}
.wall{position:absolute;inset:0;background:var(--wall);background-size:cover;transition:background .5s}
.innerL .wall{background-size:200% 100%;background-position:0 0}
.innerR .wall{background-size:200% 100%;background-position:100% 0}
.view{position:absolute;inset:0;z-index:2;overflow:hidden}
.view.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
.view.appopen{animation:appopen .38s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{transform:scale(1.12);opacity:0}}
@keyframes appopen{from{transform:scale(.6);opacity:0;border-radius:3em}}
.status{position:absolute;left:0;right:0;top:0;height:2.7em;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:0 1.6em 0 2.2em;font-weight:600;pointer-events:none;color:#fff;transition:color .3s;font-size:1em}
.innerL .status .st-i,.innerR .status .st-t{visibility:hidden}
.screen.lightapp .status{color:#000}
.st-t{font-variant-numeric:tabular-nums}
.st-i{display:flex;gap:.38em;align-items:center}
.st-i svg{height:.78em;fill:currentColor}
.bat{position:relative;display:inline-block;width:2em;height:.95em;border-radius:.3em;border:1px solid currentColor;opacity:.95;padding:1px}
.bat::after{content:"";position:absolute;right:-.2em;top:30%;height:40%;width:.12em;background:currentColor;border-radius:0 1px 1px 0;opacity:.5}
.bat i{display:block;height:100%;background:currentColor;border-radius:.16em}
.island{position:absolute;top:.7em;left:50%;transform:translateX(-50%);width:7.2em;height:2em;border-radius:1em;background:#000;z-index:7;box-shadow:inset 0 0 0 1px #111}
.island::after{content:"";position:absolute;right:.6em;top:.55em;width:.9em;height:.9em;border-radius:50%;background:radial-gradient(circle at 40% 40%,#2a3350,#07070c 60%)}
.punch{position:absolute;top:.9em;left:50%;transform:translateX(-50%);width:1.1em;height:1.1em;border-radius:50%;background:radial-gradient(circle at 40% 40%,#283050,#000 60%);z-index:7}
.homebar{position:absolute;left:50%;bottom:.55em;transform:translateX(-50%);width:36%;height:1.4em;z-index:8;cursor:pointer;display:flex;align-items:flex-end;justify-content:center}
.homebar::before{content:"";width:100%;height:.38em;border-radius:1em;background:rgba(255,255,255,.85)}
.screen.lightapp .homebar::before{background:rgba(0,0,0,.8)}
.screen.nohome .homebar{display:none}
.dim{position:absolute;inset:0;background:#000;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s}
.off{position:absolute;inset:0;background:#000;z-index:40;opacity:0;pointer-events:none;transition:opacity .45s}
.screen.isoff .off{opacity:1;pointer-events:auto}
.hud{position:absolute;left:.9em;top:30%;width:2.4em;height:9em;border-radius:1.2em;background:rgba(60,60,64,.75);backdrop-filter:blur(10px);z-index:35;overflow:hidden;opacity:0;transition:opacity .3s;pointer-events:none}
.hud i{position:absolute;left:0;right:0;bottom:0;background:#fff}
.hud.on{opacity:1}

/* home */
.home{position:absolute;inset:0;padding:3.6em 1.2em 1em;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:1.5em;justify-items:center;margin-top:1.4em}
.ic{display:flex;flex-direction:column;align-items:center;gap:.4em;width:100%}
.ico{display:block;width:4em;height:4em;border-radius:22.5%;overflow:hidden;box-shadow:0 .2em .6em rgba(0,0,0,.25);transition:transform .15s}
.ic:active .ico{transform:scale(.9);filter:brightness(.8)}
.ico svg{width:100%;height:100%;display:block}
.lbl{font-size:.72em;font-weight:500;text-shadow:0 1px 2px rgba(0,0,0,.35);white-space:nowrap}
.dock{margin-top:auto;margin-bottom:1.3em;display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;padding:.85em .4em;border-radius:2.2em;background:rgba(255,255,255,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.dock .lbl{display:none}
.pg{display:flex;gap:.45em;justify-content:center;margin-top:auto;margin-bottom:.9em}
.pg i{width:.45em;height:.45em;border-radius:50%;background:rgba(255,255,255,.4)}.pg i.on{background:#fff}
.glass{background:rgba(255,255,255,.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:1.6em;cursor:pointer}
.ww{display:flex;justify-content:space-between;padding:1em 1.2em;background:linear-gradient(160deg,#4a8fe0,#2a5fb8);border-radius:1.6em;cursor:pointer;box-shadow:0 .3em 1em rgba(0,0,0,.2)}
.ww .c{font-size:.85em;font-weight:600}.ww .t{font-size:2.6em;font-weight:300;line-height:1.05}
.ww .r{text-align:right;font-size:.75em;display:flex;flex-direction:column;justify-content:flex-end;gap:.15em}
.ww svg{width:2.2em;align-self:flex-end}
.hl-date{font-size:1.05em;font-weight:600;opacity:.9;margin-top:.6em;padding-left:.2em}
.hl-time{font-size:5.6em;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;padding-left:.05em}
.wgs{display:grid;grid-template-columns:1fr 1fr;gap:.9em;margin-top:1.4em}
.wg{border-radius:1.6em;padding:1em;min-height:9em;cursor:pointer;position:relative;overflow:hidden}
.wg.wide{grid-column:span 2;min-height:0}
.wg.mu{background:linear-gradient(150deg,#ff5f7e,#b51e4b)}
.wg.mu .art{width:3.2em;height:3.2em;border-radius:.6em;background:var(--art);box-shadow:0 .2em .5em rgba(0,0,0,.3)}
.wg.mu .tt{font-weight:600;font-size:.85em;margin-top:.7em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg.mu .ar{font-size:.75em;opacity:.8}
.wg.mu .pp{position:absolute;right:.9em;top:.9em;width:2.2em;height:2.2em;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.wg.mu .pp svg{width:.9em;fill:#fff}
.cal{background:rgba(255,255,255,.92);color:#111;cursor:default}
.cal .mh{display:flex;justify-content:space-between;font-weight:700;font-size:.85em;margin-bottom:.5em}.cal .mh span{color:#ff3b30;text-transform:capitalize}
.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.72em;row-gap:.35em}
.cal .cg b{color:#999;font-weight:600}.cal .cg i{font-style:normal;padding:.15em 0;border-radius:50%}.cal .cg i.td{background:#ff3b30;color:#fff;font-weight:700}
.batw{display:flex;gap:1em;align-items:center;background:rgba(30,30,32,.55)}
.ring{width:3.4em;height:3.4em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9em;font-weight:700}
.ring span{width:2.7em;height:2.7em;border-radius:50%;background:#1d1d1f;display:flex;align-items:center;justify-content:center}
.memo{height:9.5em;border-radius:1.6em;background:var(--memo);background-size:cover;position:relative;cursor:pointer;margin-top:.4em;box-shadow:0 .3em 1em rgba(0,0,0,.25)}
.memo div{position:absolute;left:1em;bottom:.9em;text-shadow:0 1px 3px rgba(0,0,0,.4)}.memo small{display:block;font-size:.7em;opacity:.85;text-transform:uppercase;letter-spacing:.05em}.memo b{font-size:1.1em}

/* lock */
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:4em;cursor:pointer;text-align:center}
.lock .pad{width:1.3em;height:1.6em;margin-bottom:.5em;transition:.3s}
.lock .pad svg{width:100%;height:100%;fill:#fff}
.lk-date{font-size:1.15em;font-weight:600;opacity:.92;text-transform:capitalize}
.lk-time{font-size:6.4em;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 .05em .3em rgba(0,0,0,.15)}
.lk-bot{position:absolute;left:2em;right:2em;bottom:2.6em;display:flex;justify-content:space-between;align-items:center}
.lk-b{width:3.2em;height:3.2em;border-radius:50%;background:rgba(0,0,0,.28);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
.lk-b svg{width:1.35em;fill:#fff}
.lk-hint{position:absolute;bottom:4.9em;left:0;right:0;font-size:.8em;opacity:.75;animation:hint 2.2s infinite}
@keyframes hint{50%{opacity:.35;transform:translateY(-.3em)}}
.ntf{width:calc(100% - 2em);margin-top:auto;margin-bottom:8em;text-align:left;padding:.9em 1em;border-radius:1.3em;background:rgba(255,255,255,.28);backdrop-filter:blur(16px);display:flex;gap:.7em;align-items:center}
.ntf .ico{width:2.6em;height:2.6em;flex:none;box-shadow:none}
.ntf b{font-size:.85em}.ntf p{margin:.1em 0 0;font-size:.8em;opacity:.9}
.lock.unl .pad{transform:translateY(-.2em)}
.faceid{width:4em;height:4em;border:.25em solid #fff;border-radius:1em;margin:1.5em auto 0;opacity:0;transition:.25s}
.lock.unl .faceid{opacity:1;animation:fid .6s ease}
@keyframes fid{0%{transform:scale(.6)}60%{transform:scale(1.08);border-color:#34c759}100%{transform:scale(1);border-color:#34c759}}

/* apps general */
.app{position:absolute;inset:0;padding-top:2.9em;display:flex;flex-direction:column}
.ttl{font-size:2.2em;font-weight:700;letter-spacing:-.02em;padding:.25em .55em .2em}
.navb{display:flex;justify-content:space-between;padding:.4em 1.1em;color:#0a84ff;font-size:1.05em;min-height:2em}
.navb button{color:#0a84ff}
/* calculator */
.calc{background:#000;padding:2.9em 1em 2.2em;justify-content:flex-end}
.cd{font-size:5em;font-weight:300;text-align:right;padding:0 .15em;white-space:nowrap;overflow:hidden;line-height:1.1;margin-bottom:.2em}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em}
.ck button{aspect-ratio:1;border-radius:50%;background:#333;font-size:1.9em;display:flex;align-items:center;justify-content:center;transition:filter .1s}
.ck button:active{filter:brightness(1.6)}
.ck button.fn{background:#a5a5a5;color:#000;font-size:1.5em}
.ck button.op{background:#ff9f0a;font-size:2.1em}
.ck button.op.sel{background:#fff;color:#ff9f0a}
.ck button.z{grid-column:span 2;aspect-ratio:auto;border-radius:3em;justify-content:flex-start;padding-left:1.05em}
/* notes */
.notes{background:#fff;color:#000}
.notes textarea{flex:1;border:0;outline:0;resize:none;background:transparent;padding:.4em 1.2em 3em;font-size:1.1em;line-height:1.45;color:#111}
.notes .meta{font-size:.75em;color:#8e8e93;text-align:center;margin:-.2em 0 .4em}
/* clock */
.clk{background:#000}
.swt{font-size:5em;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:1.2em 0 .7em;letter-spacing:-.02em}
.swb{display:flex;justify-content:space-between;padding:0 1.2em}
.swb button{width:5.6em;height:5.6em;border-radius:50%;font-size:1em;font-weight:500;box-shadow:0 0 0 .2em #000,0 0 0 .3em currentColor}
.swb .b1{background:#333;color:#fff}.swb .b2{background:#0a2a12;color:#30d158}.swb .b2.stop{background:#3a0e0c;color:#ff453a}
.laps{margin:1.4em 1.2em 0;border-top:1px solid #333;overflow:auto;flex:1;padding-bottom:3em}
.laps div{display:flex;justify-content:space-between;padding:.75em 0;border-bottom:1px solid #222;font-variant-numeric:tabular-nums;font-size:1.05em}
.tabs{display:flex;justify-content:space-around;padding:.6em 0 2.2em;font-size:.7em;color:#777;border-top:1px solid #1c1c1e}.tabs .on{color:#ff9f0a}
/* weather */
.wx{background:linear-gradient(180deg,#3a6db5 0%,#5b8fd1 45%,#87acd9 100%);text-align:center;overflow:auto}
.wx .city{font-size:2.1em;margin-top:.7em}.wx .tmp{font-size:6.5em;font-weight:200;line-height:1;margin-left:.15em}
.wx .cond{font-size:1.1em;font-weight:500}.wx .hl{font-size:1.05em;font-weight:500}
.wcard{margin:1em .9em 0;border-radius:1.2em;background:rgba(30,60,110,.28);backdrop-filter:blur(10px);text-align:left;padding:.8em 1em}
.wcard small{display:block;font-size:.72em;text-transform:uppercase;opacity:.7;border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:.5em;margin-bottom:.6em;letter-spacing:.04em}
.hrs{display:flex;justify-content:space-between;text-align:center;font-size:.85em}.hrs div{display:flex;flex-direction:column;gap:.45em;font-weight:500}
.hrs svg,.days svg{width:1.6em;margin:0 auto}
.days div{display:grid;grid-template-columns:3.5em 2em 1fr;align-items:center;padding:.4em 0;font-size:.95em;font-weight:500;gap:.5em}
.days .tb{height:.3em;border-radius:1em;background:linear-gradient(90deg,#8fd3ff,#ffd60a,#ff9f0a)}
/* music */
.mus{background:linear-gradient(180deg,var(--mc1),var(--mc2));padding:3.6em 1.6em 2em;transition:background .6s}
.mus .art{width:100%;aspect-ratio:1;border-radius:.8em;background:var(--art);box-shadow:0 1em 2.5em rgba(0,0,0,.45);transition:transform .4s}
.mus.paused .art{transform:scale(.86)}
.mus .tt{margin-top:1.5em;font-size:1.3em;font-weight:700}.mus .ar{font-size:1.1em;opacity:.65}
.prog{margin-top:1.3em;height:.45em;border-radius:1em;background:rgba(255,255,255,.25);cursor:pointer;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.85);border-radius:1em}
.pt{display:flex;justify-content:space-between;font-size:.72em;opacity:.6;margin-top:.4em;font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:space-around;align-items:center;margin-top:1.2em}
.ctl svg{fill:#fff;width:2.4em}.ctl .pl svg{width:3em}
.vol{display:flex;align-items:center;gap:.6em;margin-top:1.6em;opacity:.8}.vol .prog{flex:1;margin:0}.vol svg{width:1em;fill:#fff}
/* camera */
.cam{background:#000;padding-top:3.4em}
.vf{position:relative;flex:1;overflow:hidden;background:#111}

const pad2=n=>String(n).padStart(2,'0');

/* ---------- audio ---------- */
const AU={ctx:null,g:null,next:0,step:0,t0:0};
function audio(){try{if(!AU.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AU.ctx=new C();AU.g=AU.ctx.createGain();AU.g.connect(AU.ctx.destination)}if(AU.ctx.state==='suspended')AU.ctx.resume();AU.g.gain.value=S.vol*.3;return AU.ctx}catch(e){return null}}
const mf=m=>440*Math.pow(2,(m-69)/12);
function note(m,t,d,type,v){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=mf(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(AU.g);o.start(t);o.stop(t+d+.05)}
function musicPlay(on){S.mu.play=on;if(on){const c=audio();if(!c){S.mu.play=false;return}const tr=TRACKS[S.mu.tr],st=60/tr.bpm/2;AU.t0=c.currentTime-S.mu.pos;AU.step=Math.ceil(S.mu.pos/st);AU.next=AU.t0+AU.step*st}refreshMusic()}
function musicSkip(d){const was=S.mu.play;S.mu.tr=(S.mu.tr+d+TRACKS.length)%TRACKS.length;S.mu.pos=0;if(was)musicPlay(true);else refreshMusic()}
function musicSeek(p){S.mu.pos=p*TRACK_LEN;if(S.mu.play)musicPlay(true);refreshMusic()}
setInterval(()=>{if(!S.mu.play||!AU.ctx)return;const c=AU.ctx,tr=TRACKS[S.mu.tr],st=60/tr.bpm/2;S.mu.pos=c.currentTime-AU.t0;
 if(S.mu.pos>=TRACK_LEN){S.mu.tr=(S.mu.tr+1)%TRACKS.length;S.mu.pos=0;musicPlay(true);return}
 while(AU.next<c.currentTime+.15){const i=AU.step,ch=tr.prog[Math.floor(i/8)%tr.prog.length],pat=[0,1,2,1,2,1,0,2];
  note(tr.root+12+ch[pat[i%8]%ch.length],AU.next,.32,'triangle',.22);
  if(i%8===0){note(tr.root-12+ch[0],AU.next,st*7,'sine',.5);ch.forEach(n=>note(tr.root+n,AU.next,st*7.5,'sine',.07))}
  if(i%4===2)note(tr.root+24+ch[1%ch.length],AU.next,.12,'sine',.05);
  AU.step++;AU.next+=st}},40);

/* ---------- geometry ---------- */
let G={},faces=[],spine=[],insts={};
const LIGHT=(v=>{const l=Math.hypot(...v);return v.map(x=>x/l)})([-.45,-.65,.75]);
const HALF=(v=>{const l=Math.hypot(...v);return v.map(x=>x/l)})([LIGHT[0],LIGHT[1],LIGHT[2]+1]);
const rotY=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return[v[0]*c+v[2]*s,v[1],-v[0]*s+v[2]*c]};
const rotX=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return[v[0],v[1]*c-v[2]*s,v[1]*s+v[2]*c]};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];

function build(){
 const saved={};for(const k in insts){saved[k]=insts[k].app;insts[k].cleanup&&insts[k].cleanup()}
 const ph=$('#phone');ph.innerHTML='';faces=[];spine=[];
 const vw=innerWidth,vh=innerHeight;let H=Math.max(300,Math.min(680,(vh-120)*.84)),W=H*.45;
 if(W*2>vw*.8){W=vw*.4;H=W/.45}
 const T=W*.064,R=W*.165,B=W*.032;G={W,H,T,R,B};
 const L=el('div','half'),Rh=el('div','half');ph.append(L,Rh);G.L=L;G.Rh=Rh;
 const F=(par,cls,w,h,tf,n,kind)=>{const e=el('div','f '+cls);e.style.width=w+'px';e.style.height=h+'px';e.style.transform=tf;par.appendChild(e);const o={el:e,n,half:par===L?'L':par===Rh?'R':'P',kind:kind||'metal',ld:-1,lh:-1};faces.push(o);return o};
 const corner=(par,cx,cy,p0,p1)=>{const N=6,dl=(p1-p0)/N*D2R,c=2*R*Math.sin(dl/2)+.6,r=R*Math.cos(dl/2);
  for(let i=0;i<N;i++){const p=p0+(i+.5)*(p1-p0)/N;F(par,'metal mv',c,T,`translate3d(${cx}px,${cy}px,${-T/2}px) rotateZ(${p}deg) translateY(${r}px) rotateX(90deg) translate(${-c/2}px,${-T/2}px)`,[-Math.sin(p*D2R),Math.cos(p*D2R),0])}};
 // LEFT half (folds) — inner screen left, cover display on back
 const lf=F(L,'front l',W,H,`translate3d(${-W}px,${-H/2}px,0)`,[0,0,1],'glass');lf.el.style.borderRadius=`${R}px 0 0 ${R}px`;
 const lb=F(L,'coverback',W,H,`translate3d(0,${-H/2}px,${-T}px) rotateY(180deg)`,[0,0,-1],'glass');lb.el.style.borderRadius=`0 ${R}px ${R}px 0`;
 F(L,'metal mv',W-R,T,`translate3d(${-W+R}px,${-H/2}px,${-T}px) rotateX(90deg)`,[0,-1,0]);
 F(L,'metal mv',W-R,T,`translate3d(${-W+R}px,${H/2}px,${-T}px) rotateX(90deg)`,[0,1,0]);
 F(L,'metal mh',T,H-2*R,`translate3d(${-W}px,${-H/2+R}px,0) rotateY(90deg)`,[-1,0,0]);
 F(L,'metal mh',T,H,`translate3d(0,${-H/2}px,0) rotateY(90deg)`,[1,0,0]);
 corner(L,-W+R,-H/2+R,90,180);corner(L,-W+R,H/2-R,0,90);
 // RIGHT half (fixed) — inner screen right, cameras on back
 const rf=F(Rh,'front r',W,H,`translate3d(0,${-H/2}px,0)`,[0,0,1],'glass');rf.el.style.borderRadius=`0 ${R}px ${R}px 0`;
 const rb=F(Rh,'camback',W,H,`translate3d(${W}px,${-H/2}px,${-T}px) rotateY(180deg)`,[0,0,-1],'back');rb.el.style.borderRadius=`${R}px 0 0 ${R}px`;
 F(Rh,'metal mv',W-R,T,`translate3d(0,${-H/2}px,${-T}px) rotateX(90deg)`,[0,-1,0]);
 const bot=F(Rh,'metal mv',W-R,T,`translate3d(0,${H/2}px,${-T}px) rotateX(90deg)`,[0,1,0]);
 bot.el.innerHTML=`<i class="port" style="left:${W/2-W*.045}px;top:${T*.3}px;width:${W*.09}px;height:${T*.4}px"></i><span class="spk" style="left:${W*.66}px;top:${T/2-1}px">${'<i></i>'.repeat(6)}</span><span class="spk" style="left:${W*.2}px;top:${T/2-1}px">${'<i></i>'.repeat(6)}</span>`;
 F(Rh,'metal mh',T,H-2*R,`translate3d(${W}px,${-H/2+R}px,0) rotateY(90deg)`,[1,0,0]);
 F(Rh,'metal mh',T,H,`translate3d(0,${-H/2}px,0) rotateY(90deg)`,[-1,0,0]);
 corner(Rh,W-R,-H/2+R,-180,-90);corner(Rh,W-R,H/2-R,-90,0);
 // side buttons
 const btn=(y,len,act)=>{const o=F(Rh,'metal mh btn',T*.46,len,`translate3d(${W+1.4}px,${y}px,${-T*.27}px) rotateY(90deg)`,[1,0,0]);o.el.dataset.btn=act;return o};
 btn(-H*.31,H*.07,'volup');btn(-H*.215,H*.07,'voldn');btn(-H*.08,H*.11,'power');
 // camera plateau
 const P=W*.44,m=W*.055;
 const pl=F(Rh,'plateau',P,P,`translate3d(${W-m}px,${-H/2+m}px,${-T-1.3}px) rotateY(180deg)`,[0,0,-1],'back');pl.el.style.borderRadius=P*.28+'px';
 pl.el.innerHTML=`<i class="flash" style="left:${P*.73-P*.07}px;top:${P*.2-P*.07}px;width:${P*.14}px;height:${P*.14}px"></i><i class="lidar" style="left:${P*.73-P*.06}px;top:${P*.8-P*.06}px;width:${P*.12}px;height:${P*.12}px"></i><i class="mic" style="left:${P*.5}px;top:${P*.5}px;width:2px;height:2px"></i>`;
 const D=P*.4;[[.27,.27],[.27,.73],[.73,.5]].forEach(([u,v])=>F(Rh,'lens',D,D,`translate3d(${W-m-u*P+D/2}px,${-H/2+m+v*P-D/2}px,${-T-2.9}px) rotateY(180deg)`,[0,0,-1],'lens'));
 const ap=el('div','apple',APPLE);ap.style.cssText=`width:${W*.17}px;left:${W/2-W*.085}px;top:${H/2-W*.1}px`;rb.el.appendChild(ap);rb.el.appendChild(el('div','fx','<div class="gl"></div>'));
 // hinge spine & caps
 for(let i=0;i<10;i++){const o=F(ph,'spine',1,H,'',null);o.nf=()=>[-Math.sin(o.phi||0),0,-Math.cos(o.phi||0)];spine.push(o)}

 // screens
 const pr=R-B;
 insts.innerL=makePane(lf.el,'innerL',B,B,W-B-.5,H-2*B,`${pr}px 0 0 ${pr}px`);

 const Bc=W*.045;insts.cover=makePane(lb.el,'cover',Bc,Bc,W-2*Bc,H-2*Bc,`${R*.45}px ${R-Bc}px ${R-Bc}px ${R*.45}px`);
 [lf,rf,lb].forEach(o=>o.el.appendChild(el('div','fx','<div class="sh"></div><div class="gl"></div><div class="cr"></div>')));

}

function makePane(parent,kind,x,y,w,h,rad){
 const e=el('div','screen '+kind);e.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${rad};font-size:${w/21}px`;
 e.innerHTML=`<div class="wall"></div><div class="view"></div><div class="status"><span class="st-t">${hm()}</span><span class="st-i">${SIG}${WIFI}<span class="bat"><i style="width:${S.batt*100}%"></i></span></span></div>${kind==='cover'?'<div class="island"></div>':kind==='innerR'?'<div class="punch"></div>':''}<div class="homebar"></div><div class="hud"><i></i></div><div class="dim"></div><div class="off"></div>`;
 parent.appendChild(e);
 const inst={kind,el:e,view:$('.view',e),app:null,cleanup:null,update:null};
 $('.homebar',e).addEventListener('click',ev=>{ev.stopPropagation();goHome(inst)});
 $('.off',e).addEventListener('click',()=>{if(!S.on&&S.mode===(kind==='cover'?'cover':'inner')){power(true)}});
 let sy=null;e.addEventListener('pointerdown',ev=>{const r=e.getBoundingClientRect();sy=ev.clientY});
 e.addEventListener('pointerup',ev=>{if(sy!=null&&sy-ev.clientY>60&&inst.app&&!S.locked){const tg=ev.target;if(!tg.closest('textarea,input,.prog'))goHome(inst)}sy=null});
 return inst}

function update(force){
 const a=S.a,ar=a*D2R,{W,H,T}=G;G.L.style.transform=`rotateY(${a}deg)`;
 const N=spine.length,dl=ar/N;
 spine.forEach((o,i)=>{if(a<.6){o.el.style.display='none';return}o.el.style.display='';const p=(i+.5)*a/N,c=2*T*Math.sin(dl/2)+.8;o.phi=p*D2R;o.el.style.width=c+'px';o.el.style.transform=`rotateY(${p}deg) translateZ(${-T*Math.cos(dl/2)}px) translate(${-c/2}px,${-H/2}px)`});
 const ph=$('#phone');ph.style.setProperty('--a',a);
 const off=-(W+Math.min(0,-W*Math.cos(ar)))/2;
 ph.style.transform=`scale(${S.zoom}) rotateX(${S.rx}deg) rotateY(${S.ry}deg) translateX(${off}px)`;
 // shadow
 const sw=(W+Math.max(0,W*Math.cos(ar)))*S.zoom*(.75+.25*Math.abs(Math.cos(S.ry*D2R)));
 const sh=$('#shadow');sh.style.width=sw+'px';sh.style.top=`calc(44% + ${H/2*S.zoom*Math.cos(S.rx*D2R)+H*.06}px)`;
 // shading
 const ry=S.ry*D2R,rx=S.rx*D2R,cr=Math.min(1,Math.sin(ar)*1.2)*.9+.06;
 for(const f of faces){let n=f.nf?f.nf():f.n;if(f.half==='L')n=rotY(n,ar);n=rotX(rotY(n,ry),rx);
  const dif=Math.max(0,dot(n,LIGHT)),sp=Math.max(0,dot(n,HALF));let d=(1-(.32+.68*dif)),h;
  if(f.kind==='metal'){h=Math.pow(sp,22)*.38;d*=.8}else if(f.kind==='back'){h=Math.pow(sp,40)*.25;d*=.6}else{h=0}
  d=Math.round(d*100)/100;h=Math.round(h*100)/100;
  if(f.kind==='glass'){const fx=f.fx||(f.fx=$('.fx',f.el));if(fx){fx.style.setProperty('--d',(d*.45).toFixed(2));fx.style.setProperty('--gx',(n[0]*60).toFixed(1));fx.style.setProperty('--gy',(n[1]*60).toFixed(1));fx.style.setProperty('--cr',cr.toFixed(2))}continue}
  if(f.kind==='cap'){f.el.style.setProperty('--b',(1-d*.8+h).toFixed(2));continue}
  if(f.kind==='lens')continue;
  if(f.kind==='back'&&f.el.classList.contains('camback')){const fx=f.fx||(f.fx=$('.fx',f.el));fx&&(fx.style.setProperty('--gx',(n[0]*60).toFixed(1)),fx.style.setProperty('--gy',(n[1]*60).toFixed(1)))}
  if(force||d!==f.ld){f.el.style.setProperty('--d',d);f.ld=d}if(force||h!==f.lh){f.el.style.setProperty('--h',h);f.lh=h}}
 // UI sync
 const open=Math.round(180-a);$('#ang').value=open;$('#angv').textContent=open+'°';$('#foldBtn').textContent=a>90?'Раскрыть':'Сложить';
 setMode(a<150?'inner':'cover');
}

function setMode(m){
 if(m!==S.mode){const prev=S.mode;S.mode=m;
  if(m==='cover'&&prev==='inner'){const ap=insts.innerR.app;if(ap){insts.cover.app=ap;insts.innerR.app=null;render(insts.innerR);render(insts.cover,true)}}
  if(m==='inner'&&prev==='cover'){const ap=insts.cover.app;if(ap){insts.innerR.app=ap;insts.cover.app=null;render(insts.cover);render(insts.innerR,true)}}}
 for(const k in insts){const act=S.on&&(k==='cover'?S.mode==='cover':S.mode==='inner');insts[k].el.classList.toggle('isoff',!act)}
}
